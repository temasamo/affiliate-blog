name: Sync Whisky RAG Embeddings

on:
  push:
    branches:
      - main-v2
    paths:
      - "articles/whisky/knowledge/**.mdx"
      - "articles/whisky/brands/**.mdx"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm
            pnpm install
          else
            npm install
          fi

      - name: 🧠 Run embedding sync script
        run: |
          npx tsx scripts/load_whisky_articles.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: ✅ Log confirmation
        run: echo "RAG embedding sync completed successfully ✅"


